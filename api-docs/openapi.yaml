  /cgi-bin/api/service:
    post:
      tags:
        - Services
      summary: Create new service
      description: |
        Creates a new HTTP(S) service check for an agent and target,
        including the URI (scheme, port, path, query), the request
        options, the F5 assertion triple and the optional
        credential-backed auth reference. pollcount and pollinterval are
        fixed at creation. Admin-only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                agent_id:
                  type: string
                  format: uuid
                target_id:
                  type: string
                  format: uuid
                scheme:
                  type: string
                  enum: [http, https]
                  default: http
                port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  default: 0
                  description: 0 means the scheme default port
                uri_path:
                  type: string
                  default: /
                  description: Empty or starting with /; no scheme or host inside
                uri_query:
                  type: string
                  default: ''
                http_method:
                  type: string
                  enum: [GET, POST, PUT, PATCH, HEAD, OPTIONS, DELETE]
                  default: GET
                http_headers:
                  type: object
                  description: Header map, stored as a JSON object
                body_encoding:
                  type: string
                  enum: [text, json, base64, form]
                  description: Required when body is present
                body:
                  type: string
                  description: Request body; send_string and body cannot both be set
                send_string:
                  type: string
                  description: When set, IS the request body (F5 semantics)
                receive_string:
                  type: string
                receive_regex:
                  type: boolean
                  default: false
                  description: True when receive_string is a Perl regex; the regex must compile
                disable_string:
                  type: string
                disable_regex:
                  type: boolean
                  default: false
                  description: True when disable_string is a Perl regex; the regex must compile
                expected_status:
                  type: string
                  description: Comma-separated NNN or NNN-NNN tokens (100..599); null or omitted means any 2xx/3xx
                follow_redirects:
                  type: boolean
                  default: false
                verify_tls:
                  type: boolean
                  default: true
                  description: Verifying is the default; turning it off is allowed but recorded
                timeout:
                  type: integer
                  minimum: 1
                  maximum: 120
                  default: 10
                auth_type:
                  type: string
                  enum: [none, basic, bearer, header]
                  description: header requires auth_header_name; anything beyond none requires auth_credential_id
                auth_header_name:
                  type: string
                  description: Header name carried when auth_type is header
                auth_credential_id:
                  type: string
                  format: uuid
                  description: Reference into the credentials table - never inline a secret; attaching a HIGH or CRITICAL sensitivity credential requires admin
                pollcount:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Fixed after creation
                pollinterval:
                  type: integer
                  minimum: 1
                  default: 300
                  description: Seconds between checks (services default to 300); fixed after creation
                is_active:
                  type: boolean
                  default: true
              required:
                - agent_id
                - target_id
      responses:
        '200':
          description: Service created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '400':
          description: Invalid input or duplicate service (an identical agent, target, scheme, port, path and query combination already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent or target not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required, or the referenced credential has HIGH or CRITICAL sensitivity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

