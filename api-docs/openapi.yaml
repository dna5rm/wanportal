openapi: 3.0.0

info:
  title: NetOPS Monitoring API
  description: |
    API for managing network monitoring agents, targets, monitors,
    services, credentials, and users. The read-only listing endpoints
    (agents, targets, monitors, services, RRD data) and the health
    check are public. The
    OpenAPI file is served at /api-docs/openapi.yaml, not under /cgi-bin/api.
    Agent polling uses the agent's password; everything else needs a
    bearer token from /login, and writes are admin-only.
  version: 1.2.0

servers:
  - url: /
    description: Relative to current host

tags:
  - name: Public API
    description: Public endpoints that provide read-only access to monitoring data and statistics.
  - name: Authentication
    description: Endpoints for user authentication and token validation.
  - name: System
    description: System and health-check endpoints.
  - name: Users
    description: User account management endpoints. Most operations require admin privileges.
  - name: Agents
    description: Monitoring agent management endpoints for creating, updating, and managing monitoring agents.
  - name: Agent Monitors
    description: Endpoints used by monitoring agents to retrieve assignments and submit results.
  - name: Agent Services
    description: Endpoints used by monitoring agents to retrieve HTTP(S) service assignments and submit service check results.
  - name: Targets
    description: Target management endpoints for creating and managing monitoring targets.
  - name: Monitors
    description: Monitor configuration endpoints for setting up and managing monitoring assignments.
  - name: Services
    description: Service check configuration endpoints for creating and managing HTTP(S) service checks alongside the reachability monitors.
  - name: Credentials
    description: Secure credential management endpoints for storing and retrieving various types of credentials.

components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http

  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string

    Success:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        description:
          type: string
        last_seen:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when active, 0 when not; request bodies also accept true/false
        password:
          type: string
          description: Agent password (only returned on auth-protected /agent/{id} for admin users, never on public /agents)

    Target:
      type: object
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        description:
          type: string
        is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when active, 0 when not; request bodies also accept true/false

    Monitor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        agent_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
        protocol:
          type: string
          enum: [ICMP, ICMPV6, TCP]
        port:
          type: integer
          minimum: 0
          maximum: 65535
        dscp:
          type: string
          enum: [BE, EF, CS0, CS1, CS2, CS3, CS4, CS5, CS6, CS7, AF11, AF12, AF13, AF21, AF22, AF23, AF31, AF32, AF33, AF41, AF42, AF43]
        pollcount:
          type: integer
          minimum: 1
          maximum: 100
        pollinterval:
          type: integer
          minimum: 10
          maximum: 3600
        is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when active, 0 when not; request bodies also accept true/false
        sample:
          type: integer
        current_loss:
          type: number
        current_median:
          type: number
        current_min:
          type: number
        current_max:
          type: number
        current_stddev:
          type: number
        avg_loss:
          type: number
        avg_median:
          type: number
        avg_min:
          type: number
        avg_max:
          type: number
        avg_stddev:
          type: number
        prev_loss:
          type: number
        last_clear:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        last_down:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        last_update:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        total_down:
          type: integer
        agent_name:
          type: string
        agent_is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when the agent is active, 0 when not
        target_address:
          type: string
        target_is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when the target is active, 0 when not

    Service:
      type: object
      description: |
        Full service-check configuration row, as GET /service/{id}
        returns it to a caller presenting a valid bearer token (the
        anonymous detail response strips it down to the display-safe
        subset). Auth is reference-only: a service carries
        auth_credential_id, never a secret.
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        agent_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
        scheme:
          type: string
          enum: [http, https]
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: 0 means the scheme default port
        uri_path:
          type: string
          description: Request path, starting with /
        uri_query:
          type: string
        http_method:
          type: string
          enum: [GET, POST, PUT, PATCH, HEAD, OPTIONS, DELETE]
        http_headers:
          type: string
          description: JSON-encoded header map (stored MariaDB JSON column returned as text), or null
        body_encoding:
          type: string
          enum: [text, json, base64, form]
          description: Required when a request body is set, null otherwise
        body:
          type: string
          description: Request body, or null
        send_string:
          type: string
          description: F5-style send string; when set it IS the request body, or null
        receive_string:
          type: string
          description: F5-style receive string (substring or regex per receive_regex), or null
        receive_regex:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when receive_string is a Perl regex, 0 for substring match
        disable_string:
          type: string
          description: F5-style disable string - a match marks the check DOWN even when receive matched, or null
        disable_regex:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when disable_string is a Perl regex, 0 for substring match
        expected_status:
          type: string
          description: Comma-separated NNN or NNN-NNN tokens (100..599), e.g. 200-299,301; null means any 2xx/3xx
        follow_redirects:
          type: integer
          minimum: 0
          maximum: 1
        verify_tls:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 verifies the TLS certificate; 0 is allowed but recorded
        timeout:
          type: integer
          minimum: 1
          maximum: 120
        auth_type:
          type: string
          enum: [none, basic, bearer, header]
          description: null means no auth
        auth_header_name:
          type: string
          description: Header name when auth_type is header, or null
        auth_credential_id:
          type: string
          format: uuid
          description: Reference into the credentials table the secret resolves from at delivery time; never a secret itself, or null
        pollcount:
          type: integer
          minimum: 1
          description: Fixed after creation
        pollinterval:
          type: integer
          minimum: 1
          description: Seconds between checks (services default to 300); fixed after creation
        is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: The service's own enabled flag; the /services listing rolls the agent and target flags in
        last_state:
          type: string
          enum: [UP, DOWN, DISABLED, UNKNOWN]
        last_status_code:
          type: integer
          description: Last HTTP response code, or 0 when none was heard
        last_reason:
          type: string
          description: Closed reason token set (status_ok, status_mismatch, receive_match, receive_miss, disable_match, empty_body, transport_error, tls_error, timeout, bad_regex, agent_unsupported, auth_error); may be null
        last_message:
          type: string
          description: Short agent-supplied detail, never the response body; may be null
        last_check:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS), or null
        last_change:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS) when the state last changed, or null
        total_down:
          type: integer
          description: Count of down polls since the last reset

    ServiceListRow:
      type: object
      description: |
        Display-safe service row from the public /services listing -
        identity, agent and target names, the URI triple, the effective
        active flag and the rolled-up live state, plus the joined
        agent/target liveness aliases and the agent's services
        capability bit. The auth reference, request shaping and
        assertion strings never appear on the anonymous listing.
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        agent_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
        agent_name:
          type: string
        agent_is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when the agent is active, 0 when not
        agent_supports_services:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when the agent has made an authenticated call to the services module; 0 means the old monitor-only agent
        target_address:
          type: string
        target_is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when the target is active, 0 when not
        scheme:
          type: string
          enum: [http, https]
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: 0 means the scheme default port
        uri_path:
          type: string
          description: Request path, starting with /
        uri_query:
          type: string
        is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: Effective active state - 1 only when the service, its agent and its target are all enabled
        last_state:
          type: string
          enum: [UP, DOWN, DISABLED, UNKNOWN]
        last_status_code:
          type: integer
          description: Last HTTP response code, or 0 when none was heard
        last_reason:
          type: string
          description: Closed reason token set (status_ok, status_mismatch, receive_match, receive_miss, disable_match, empty_body, transport_error, tls_error, timeout, bad_regex, agent_unsupported, auth_error); may be null
        last_check:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS), or null
        last_change:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS) when the state last changed, or null
        total_down:
          type: integer
          description: Count of down polls since the last reset

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 for admin users, 0 for regular users
        is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when active, 0 when not; request bodies also accept true/false
        last_login:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        failed_attempts:
          type: integer
        locked_until:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        created_at:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        created_by:
          type: string
        updated_at:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        updated_by:
          type: string

    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        site:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ACCOUNT, CERTIFICATE, API, PSK, CODE]
        username:
          type: string
        password:
          type: string
          description: Only included in the detail response for admin users; never included in list responses
        url:
          type: string
        owner:
          type: string
        comment:
          type: string
        expiry_date:
          type: string
          description: Expiration timestamp (YYYY-MM-DD HH:MM:SS), or null
        is_active:
          type: integer
          minimum: 0
          maximum: 1
          description: 1 when active, 0 when not; request bodies also accept true/false
        sensitivity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        metadata:
          type: string
          description: JSON-encoded metadata text (stored MariaDB JSON column returned as text), or null
        created_at:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        created_by:
          type: string
        last_accessed_at:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        last_accessed_by:
          type: string
        updated_at:
          type: string
          description: Server timestamp (YYYY-MM-DD HH:MM:SS)
        updated_by:
          type: string

paths:
  /cgi-bin/api/health:
    get:
      tags:
        - System
      summary: Health check
      description: |
        Public endpoint to verify the API is running. Reports host
        uptime in whole seconds, read from /proc/uptime.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime_seconds:
                    type: integer
                    description: Host uptime in whole seconds (from /proc/uptime)

  /cgi-bin/api/login:
    post:
      tags:
        - Authentication
      summary: User authentication
      description: |
        Authenticates a user via local database or LDAP (if enabled).
        Returns a signed JWT that carries the username and an is_admin
        flag and is valid for one hour. Local accounts lock for 30
        minutes after 5 failed attempts. The response also carries
        the signed claims (username, is_admin, exp) so clients never
        decode the token themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  token:
                    type: string
                    description: JWT token
                  username:
                    type: string
                    description: Authenticated username claim
                  is_admin:
                    type: boolean
                    description: Admin flag claim
                  exp:
                    type: integer
                    description: Token expiry as Unix epoch seconds (claim)
        '400':
          description: Invalid input (username and password are required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials or account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/session:
    get:
      tags:
        - Authentication
      summary: Get current session claims
      description: Returns the username, is_admin flag and expiry timestamp carried by the caller's bearer token. Requires a valid JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims of the caller's token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  username:
                    type: string
                  is_admin:
                    type: boolean
                  exp:
                    type: integer
                    description: Unix epoch seconds when the token expires
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/test:
    post:
      tags:
        - Authentication
      summary: Verify authentication
      description: Test endpoint to verify if a JWT token is valid. Returns the decoded payload.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    description: Decoded JWT payload
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/agent:
    post:
      tags:
        - Agents
      summary: Create new agent
      description: Creates a new monitoring agent in the system.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Unique name for the agent
                address:
                  type: string
                  description: IP address of the agent
                description:
                  type: string
                is_active:
                  type: boolean
                  default: true
                password:
                  type: string
                  description: |
                    Agent password used by the polling endpoints. If
                    omitted, a well-known placeholder (CHANGE_ME) is
                    assigned - set a real password before deploying the
                    agent.
              required:
                - name
      responses:
        '200':
          description: Agent created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '400':
          description: Invalid input or duplicate name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/agent/{id}:
    get:
      tags:
        - Agents
      summary: Get agent details
      description: Retrieves detailed information about a specific monitoring agent. Includes the agent password only when the authenticated user is an admin.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Agent ID
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  agent:
                    $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Agents
      summary: Update agent
      description: Updates an existing agent's configuration.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Agent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                description:
                  type: string
                is_active:
                  type: boolean
                password:
                  type: string
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input (empty body or invalid IP address)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Agents
      summary: Delete agent
      description: Removes an agent and all its associated monitors from the system. Cannot delete the LOCAL agent.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Agent ID
      responses:
        '200':
          description: Agent deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
                  deleted_monitors:
                    type: array
                    items:
                      type: string
                      format: uuid
        '403':
          description: Admin required, or attempt to delete the LOCAL agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/agent/{id}/monitors:
    get:
      tags:
        - Agent Monitors
      summary: Get agent's monitor assignments
      description: |
        Returns a list of active monitors assigned to the specified
        agent, limited to monitors that are due for polling based on
        their interval. Agents authenticate with their agent password
        (sent in the request body), not with a user JWT - the same
        password the agent was created with. If the agent exists but is
        inactive, the response is success with an empty list. Each call
        also refreshes the agent's stored address (first X-Forwarded-For
        hop, validated as IPv4/IPv6) and last_seen time.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Agent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Agent password for authentication
              required:
                - password
      responses:
        '200':
          description: List of monitors
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  monitors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        address:
                          type: string
                        protocol:
                          type: string
                        port:
                          type: integer
                        dscp:
                          type: string
                        pollcount:
                          type: integer
                        pollinterval:
                          type: integer
        '401':
          description: Invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Agent Monitors
      summary: Submit monitor results
      description: Accepts monitoring results from an agent and updates the monitor statistics. Creates or updates RRD files for data storage.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Agent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                results:
                  type: array
                  description: Batch of poll results. May be empty or omitted - the call then succeeds without filing anything.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      min:
                        type: number
                      max:
                        type: number
                      median:
                        type: number
                      loss:
                        type: number
                      stddev:
                        type: number
                    required:
                      - id
                      - min
                      - max
                      - median
                      - loss
                      - stddev
              required:
                - password
      responses:
        '200':
          description: Results submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/agent/{id}/services:
    get:
      tags:
        - Agent Services
      summary: Get agent's service assignments
      description: |
        Returns a list of the ACTIVE HTTP(S) service checks assigned to
        the specified agent that are due for polling (active service,
        active target, last_check NULL or older than pollinterval).
        Agents authenticate with their agent password (sent in the
        request body), not with a user JWT - the same password the agent
        was created with. If the agent exists but is inactive, the
        response is success with an empty list. Each entry carries the
        full URI plus the assertion config, and the auth secret resolved
        from the credentials table at delivery time - a missing, inactive
        or expired credential is refused, so the entry carries
        auth_error instead of a secret. The request body may still
        carry supports_services / version, but those keys are ignored
        on this GET (and on every request); nothing from a request
        body is ever recorded. The agent's version is recorded from
        the `NetPing-Agent/<version>` User-Agent header on every
        authenticated check-in, and capability (supports_services) is
        derived from the agent's first authenticated contact with the
        services module.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Agent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Agent password for authentication
                supports_services:
                  type: boolean
                  description: Accepted for compatibility but ignored - capability is derived from this authenticated contact with the services module, not from this body
                version:
                  type: string
                  description: Accepted for compatibility but ignored - the agent version is recorded from the `NetPing-Agent/<version>` User-Agent header on every authenticated request
              required:
                - password
      responses:
        '200':
          description: List of service checks due for polling
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        address:
                          type: string
                          description: Target host (IP or hostname) from the targets table
                        scheme:
                          type: string
                        port:
                          type: integer
                        uri_path:
                          type: string
                        uri_query:
                          type: string
                        http_method:
                          type: string
                        http_headers:
                          type: object
                          description: Header map decoded by the portal, or the raw text if it does not decode, or null
                        body_encoding:
                          type: string
                        body:
                          type: string
                        send_string:
                          type: string
                        receive_string:
                          type: string
                        receive_regex:
                          type: integer
                        disable_string:
                          type: string
                        disable_regex:
                          type: integer
                        expected_status:
                          type: string
                        follow_redirects:
                          type: integer
                        verify_tls:
                          type: integer
                        timeout:
                          type: integer
                        auth_type:
                          type: string
                        auth_header_name:
                          type: string
                        auth_username:
                          type: string
                          description: Resolved credential username when auth applies
                        auth_secret:
                          type: string
                          description: Resolved credential secret when auth applies; never logged
                        auth_error:
                          type: integer
                          description: 1 when the auth reference could not be resolved (missing, inactive or expired credential) and no secret ships
        '401':
          description: Invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Agent Services
      summary: Submit service results
      description: |
        Accepts a batch of HTTP check results from an agent and updates
        each service's rolled-up state and its service RRD. Base fields
        id, loss and median are required; unknown extra result fields
        are ignored for forward compatibility, and an empty or omitted
        results array succeeds without filing anything. Results are only
        filed against services that belong to the authenticated agent -
        another agent's id fails exactly like a bogus one. The posted
        state wins when it is UP, DOWN or DISABLED and is otherwise
        derived from loss (loss=100 DOWN, else UP). Nothing is recorded
        from the request body: supports_services / version are accepted
        and ignored. The agent's version is recorded from its
        `NetPing-Agent/<version>` User-Agent header on every
        authenticated agent request, and capability (supports_services)
        is derived from the agent's first authenticated contact with
        this module.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Agent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                supports_services:
                  type: boolean
                  description: Accepted for compatibility but ignored - capability is derived from the agent's first authenticated contact with this module, not from this body
                version:
                  type: string
                  description: Accepted for compatibility but ignored - the agent version is recorded from the `NetPing-Agent/<version>` User-Agent header on every authenticated request
                results:
                  type: array
                  description: Batch of check results. May be empty or omitted - the call then succeeds without filing anything.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      loss:
                        type: number
                        description: 0 on success, 100 on failure or DISABLED
                      median:
                        type: number
                        description: Measured request time in ms on success, 0 on failure
                      state:
                        type: string
                        enum: [UP, DOWN, DISABLED]
                      status_code:
                        type: integer
                        description: HTTP response code; a value outside 100..599 is recorded as 0
                      reason:
                        type: string
                        description: Closed reason token, truncated to 64 chars
                      message:
                        type: string
                        description: Short detail, never the response body, truncated to 255 chars
                    required:
                      - id
                      - loss
                      - median
              required:
                - password
      responses:
        '200':
          description: Results submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        '400':
          description: Invalid input (missing required fields or a service ID not owned by this agent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid agent credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

