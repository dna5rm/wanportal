  /cgi-bin/api/monitors:
    get:
      tags:
        - Public API
      summary: List all monitors
      description: Returns a list of all monitors with their current status and configuration. Supports filtering by status and activity state, by owning agent or target, and free-text search.
      parameters:
        - in: query
          name: current_loss
          schema:
            type: integer
            minimum: 0
            maximum: 100
          description: Exact-match filter on current loss percentage
        - in: query
          name: is_active
          schema:
            type: integer
            minimum: 0
            maximum: 1
          description: Filter by effective active state (1 = active, 0 = inactive)
        - in: query
          name: agent_id
          schema:
            type: string
            format: uuid
          description: Filter to monitors owned by this agent (bound as a query parameter, so junk ids simply match nothing)
        - in: query
          name: target_id
          schema:
            type: string
            format: uuid
          description: Filter to monitors pointed at this target
        - in: query
          name: q
          schema:
            type: string
          description: |
            Free-text substring filter across monitor description, agent
            name/address, and target address/description; % and _ inside
            the value keep acting as SQL wildcards.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  monitors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Monitor'

  /cgi-bin/api/monitors/{id}:
    get:
      tags:
        - Public API
      summary: Get monitor details
      description: |
        Returns a single monitor with current status, configuration, and
        joined agent/target fields. Rows carry the computed
        latency_flag / latency_threshold_ms pair (also present on
        /monitors list rows): the threshold is avg_median + 2*avg_stddev,
        and the flag is raised only for effectively-active monitors with
        fresh data (last_update newer than 3 * pollinterval seconds),
        loss below 100%, at least two samples, and a current median
        above that threshold. monitor_is_active is the monitor's own
        enabled flag, while is_active is the effective one (monitor AND
        agent AND target).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Monitor ID
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  monitor:
                    allOf:
                      - $ref: '#/components/schemas/Monitor'
                      - type: object
                        properties:
                          monitor_is_active:
                            type: integer
                            minimum: 0
                            maximum: 1
                            description: The monitor's own enabled flag, before the agent/target rollup
                          agent_description:
                            type: string
                          agent_address:
                            type: string
                          target_description:
                            type: string
                          latency_flag:
                            type: integer
                            minimum: 0
                            maximum: 1
                            description: 1 when the monitor is a live latency spike by the shared rules
                          latency_threshold_ms:
                            type: number
                            description: Spike bar in ms (avg_median + 2*avg_stddev); 0 means no baseline
        '400':
          description: Invalid monitor ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Monitor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/services:
    get:
      tags:
        - Public API
      summary: List services
      description: |
        Public listing of the HTTP(S) service checks beside the
        reachability monitors: display-safe fields only - identity,
        agent and target names, the URI triple, the effective active
        flag (service, agent and target all enabled, the same rule
        /monitors applies) and the rolled-up live state. For parity
        with /monitors the rows also carry the joined liveness aliases
        (agent_is_active, target_is_active) and the agent's
        services capability bit (agent_supports_services), so a client
        can name which side is disabled - the capability pair is
        already public on /agents. The auth reference, request body
        and header map, assertion strings and HTTP method never appear
        - that is the config an attacker would aim at a target with,
        while an anonymous visitor only needs the status tables.
        Supports filtering by owning agent or target, the effective
        active state, and free-text search, mirroring /monitors.
      parameters:
        - in: query
          name: agent_id
          schema:
            type: string
            format: uuid
          description: Filter to services owned by this agent (bound as a query parameter, so junk ids simply match nothing)
        - in: query
          name: target_id
          schema:
            type: string
            format: uuid
          description: Filter to services pointed at this target
        - in: query
          name: is_active
          schema:
            type: integer
            minimum: 0
            maximum: 1
          description: Filter by effective active state (1 = active, 0 = inactive; a service under a paused agent is not active)
        - in: query
          name: q
          schema:
            type: string
          description: |
            Free-text substring filter across service description, URI
            path and target address; % and _ inside the value keep
            acting as SQL wildcards.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceListRow'

  /cgi-bin/api/dashboard:
    get:
      tags:
        - Public API
      summary: Dashboard rollup
      description: |
        Aggregated health over effectively-active monitors: up (loss
        below 1%), degraded (1% to 99%), and down (loss at 100%) counts
        with percents rounded half-up, plus the top five slowest links
        by current median. Down monitors sort last so the slowest slots
        go to live links first. Additive service side: effectively
        active services bucketed by check state (UP; DOWN or DISABLED;
        anything else unknown) plus the five most recently changed down
        services - services_total and services_down stay authoritative
        when more than five are down, and the full listing lives on the
        services route.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  dashboard:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Effectively-active monitors
                      up:
                        type: integer
                        description: Monitors with current loss below 1%
                      degraded:
                        type: integer
                        description: Monitors with current loss between 1% and 99%
                      down:
                        type: integer
                        description: Monitors with current loss at 100%
                      percent_up:
                        type: integer
                      percent_degraded:
                        type: integer
                      percent_down:
                        type: integer
                      top_slow:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            description:
                              type: string
                            agent_id:
                              type: string
                              format: uuid
                            target_id:
                              type: string
                              format: uuid
                            agent_name:
                              type: string
                            target_address:
                              type: string
                            current_median:
                              type: number
                            current_loss:
                              type: number
                      services_up:
                        type: integer
                        description: Effectively-active services last seen UP
                      services_down:
                        type: integer
                        description: Effectively-active services last seen DOWN or DISABLED
                      services_unknown:
                        type: integer
                        description: Effectively-active services in any other state (UNKNOWN or no check yet)
                      services_total:
                        type: integer
                        description: Effectively-active services; the three service buckets always sum to this
                      down_services:
                        type: array
                        maxItems: 5
                        description: Five most recently changed down services, newest change first; rows without a last_change timestamp sort last
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            description:
                              type: string
                            agent_id:
                              type: string
                              format: uuid
                            target_id:
                              type: string
                              format: uuid
                            agent_name:
                              type: string
                            target_address:
                              type: string
                            last_state:
                              type: string
                              enum: [DOWN, DISABLED]
                            last_status_code:
                              type: integer
                              description: Last HTTP response code, or 0 when none was heard
                            last_reason:
                              type: string
                              description: Closed reason token, may be null
                            last_check:
                              type: string
                              description: Server timestamp (YYYY-MM-DD HH:MM:SS), may be null

  /cgi-bin/api/rrd:
    get:
      tags:
        - Public API
      summary: Get RRD data
      description: |
        Retrieves monitoring data from RRD files. Returns raw data points
        as JSON, or a PNG graph when cmd=graph. Supports both RTT and
        loss metrics. The monitor id is validated as a UUID before it is
        used. With no start/end given, the range defaults to the last
        three hours.
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Monitor ID
        - in: query
          name: cmd
          schema:
            type: string
            enum: [graph]
          description: Command to execute. If 'graph', returns PNG image instead of JSON data
        - in: query
          name: ds
          schema:
            type: string
            enum: [rtt, loss]
            default: rtt
          description: Data source to query
        - in: query
          name: start
          schema:
            type: string
            format: date-time
          description: Start time for data range (ISO 8601 format)
        - in: query
          name: end
          schema:
            type: string
            format: date-time
          description: End time for data range (ISO 8601 format)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  start_time:
                    type: integer
                    description: Unix timestamp of start time
                  end_time:
                    type: integer
                    description: Unix timestamp of end time
                  step:
                    type: integer
                    description: Time interval between data points
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: integer
                          description: Unix timestamp
                        datetime:
                          type: string
                          description: Timestamp (YYYY-MM-DD HH:MM:SS)
                        loss:
                          type: number
                        rtt:
                          type: number
            image/png:
              schema:
                type: string
                format: binary
              description: PNG graph when cmd=graph
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Monitor or RRD file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: RRD operation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/docs:
    get:
      tags:
        - Public API
      summary: List API documentation files
      description: |
        Public endpoint listing the markdown guides under /srv/api-docs,
        the same directory Parsedown renders as
        /api-docs/index.php?file=... Only .md basenames are returned
        (Parsedown.php is never listed), sorted by name, each with the
        title from its first "# " heading. Read-only and parameter-free;
        a missing docs directory yields an empty list.
      responses:
        '200':
          description: Catalog of markdown guides
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Markdown basename (e.g. test_users.md)
                        title:
                          type: string
                          description: First "# " heading of the file

  /cgi-bin/api/runtime-stats:
    get:
      tags:
        - System
      summary: Runtime stats (host + monitoring health)
      description: |
        JWT-protected system readout the deliberately minimal public
        /health must not expose: host uptime/load/memory/disk (host
        figures - this container shares the host kernel and mounts, so
        the numbers describe the HOST, and the scope field says so) and
        monitoring freshness (agents reporting within the last hour vs
        stale, newest monitor collection, newest service check, and the
        agent version census). Any valid token may read it; admin is
        not required, the same policy as GET /session. Nothing secret
        is returned - capacity and freshness numbers only. The route
        takes no parameters and is designed to fail soft: every field
        degrades to null when its source (database or /proc) cannot be
        read, so the snapshot itself never 500s.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Runtime snapshot; fail-soft - unreadable sources render as null
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  runtime:
                    type: object
                    properties:
                      host:
                        type: object
                        description: |
                          Host figures from /proc plus one fixed df -kP read.
                          The CGI process runs in a container that shares the
                          host kernel and mounts, so these numbers describe
                          the HOST, not the container - the scope field
                          labels them so. Each field renders null when its
                          own source cannot be read or parsed; the rest of
                          the block still answers.
                        properties:
                          scope:
                            type: string
                            example: host (container shares the host kernel and mounts)
                          uptime_seconds:
                            type: integer
                            description: Host uptime in whole seconds from /proc/uptime; null when the read fails (distinct from 0, a just-booted host)
                          loadavg:
                            type: object
                            description: Load averages from /proc/loadavg; the whole object is null when the file cannot be read or parsed
                            properties:
                              one_min:
                                type: number
                                description: 1-minute load average
                              five_min:
                                type: number
                                description: 5-minute load average
                              fifteen_min:
                                type: number
                                description: 15-minute load average
                          memory:
                            type: object
                            description: Memory in kB from /proc/meminfo; the whole object is null when the file cannot be read
                            properties:
                              total_kb:
                                type: integer
                                description: MemTotal in kB
                              available_kb:
                                type: integer
                                description: MemAvailable in kB (counts reclaimable caches, not just free); null on kernels without a MemAvailable row
                          disk:
                            type: object
                            description: Disk usage from df -kP on the fixed /srv mount point; the whole object is null when the df read fails or no /srv row is found
                            properties:
                              path:
                                type: string
                                example: /srv
                              total_kb:
                                type: integer
                                description: Total size in 1024-byte blocks
                              used_kb:
                                type: integer
                                description: Used space in 1024-byte blocks
                              avail_kb:
                                type: integer
                                description: Available space in 1024-byte blocks
                              use_pct:
                                type: integer
                                description: Used percent without the percent sign; null when it cannot be parsed
                      monitoring:
                        type: object
                        description: |
                          Monitoring freshness from the database. The
                          connection and every query fail separately and
                          quietly - whatever cannot be read stays null
                          while the rest still answers; an empty agents
                          table still reports the counters as 0/0/0, not
                          null.
                        properties:
                          agents_total:
                            type: integer
                            description: All agents; agents_reporting plus agents_stale always equals this
                          agents_reporting:
                            type: integer
                            description: Agents whose last_seen is within the reporting window (the last hour)
                          agents_stale:
                            type: integer
                            description: Agents not seen within the window, never-seen agents included
                          reporting_window:
                            type: string
                            example: 1h
                          last_collection:
                            type: string
                            description: Newest monitor collection (MAX(last_update)), server timestamp (YYYY-MM-DD HH:MM:SS); null when nothing has ever collected or the DB is unreachable
                          last_service_check:
                            type: string
                            description: Newest service check (MAX(last_check)), server timestamp (YYYY-MM-DD HH:MM:SS); null when nothing has ever checked or the DB is unreachable
                      agent_versions:
                        type: array
                        description: |
                          Agent version census: the self-reported
                          agent_version each upgraded agent stamps at
                          check-in, grouped with counts. Null only when the
                          census query itself fails; an empty fleet is an
                          empty array. Agents that never reported a version
                          group under a null agent_version and sort last,
                          so consumers can spot a not-yet-upgraded fleet.
                        items:
                          type: object
                          properties:
                            agent_version:
                              type: string
                              description: Self-reported agent version; may be null for agents that never reported one
                            count:
                              type: integer
                              description: Number of agents reporting that version
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/credentials:
    get:
      tags:
        - Credentials
      summary: List credentials
      description: |
        Returns a list of stored credentials with optional filtering.
        Passwords are never included in list responses. With no
        is_active parameter only active entries are listed; pass
        is_active=0 for inactive ones or is_active=1 for active ones
        (there is no combined listing). is_active only accepts 0 or 1.

        Any other credential column (site, name, type, username, url,
        owner, sensitivity, ...) can be used as a query parameter:
        values match exactly by default, accept comparison prefixes
        (=, !=, <, <=, >, >=), a %...% wildcard for a LIKE match, and
        the sentinels NULL and NOT NULL for null checks.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: is_active
          schema:
            type: integer
            minimum: 0
            maximum: 1
          description: Filter by active status (only 0 or 1 accepted)
        - in: query
          name: site
          schema:
            type: string
          description: Filter by site
        - in: query
          name: type
          schema:
            type: string
            enum: [ACCOUNT, CERTIFICATE, API, PSK, CODE]
          description: Filter by credential type
        - in: query
          name: sensitivity
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
          description: Filter by sensitivity level
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
    post:
      tags:
        - Credentials
      summary: Create new credential
      description: Creates a new credential entry in the system.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the credential
                type:
                  type: string
                  enum: [ACCOUNT, CERTIFICATE, API, PSK, CODE]
                  description: Type of credential
                site:
                  type: string
                  description: Site or system the credential is for
                username:
                  type: string
                  description: Username if applicable
                password:
                  type: string
                  description: Password or secret value
                url:
                  type: string
                  description: Related URL if applicable
                owner:
                  type: string
                  description: Owner of the credential
                comment:
                  type: string
                  description: Additional notes
                expiry_date:
                  type: string
                  format: date-time
                  description: Expiration date if applicable
                sensitivity:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                  default: MEDIUM
                  description: Sensitivity level of the credential
                metadata:
                  type: object
                  description: Additional structured data
              required:
                - name
                - type
      responses:
        '200':
          description: Credential created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  id:
                    type: string
                    format: uuid
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/credentials/{id}:
    get:
      tags:
        - Credentials
      summary: Get credential details
      description: Retrieves detailed information about a specific credential. The stored password is included only for admin users; every view also updates the credential's last_accessed_at / last_accessed_by stamp.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  credential:
                    $ref: '#/components/schemas/Credential'
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Credentials
      summary: Update credential
      description: Updates an existing credential's information. Tracks update history with timestamp and user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [ACCOUNT, CERTIFICATE, API, PSK, CODE]
                site:
                  type: string
                username:
                  type: string
                password:
                  type: string
                url:
                  type: string
                owner:
                  type: string
                comment:
                  type: string
                expiry_date:
                  type: string
                  format: date-time
                sensitivity:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                metadata:
                  type: object
                is_active:
                  type: boolean
      responses:
        '200':
          description: Credential updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Credentials
      summary: Delete credential
      description: Soft deletes a credential by marking it inactive. If already inactive, performs hard delete.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Credential ID
      responses:
        '200':
          description: Credential deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    description: Indicates whether soft or hard delete was performed
        '404':
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/users:
    get:
      tags:
        - Users
      summary: List all users
      description: Returns a list of users in the system. Requires admin privileges. Passwords are never included in the response. Optional query filters - q (substring match over username, full_name and email), is_admin and is_active (only 0 or 1 accepted; any other value is ignored).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Substring filter matched against username, full_name and email
        - in: query
          name: is_admin
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1
          description: Filter by admin role (only 0 or 1 accepted; any other value is ignored)
        - in: query
          name: is_active
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1
          description: Filter by account status (only 0 or 1 accepted; any other value is ignored)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          description: Unauthorized - Requires admin privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Users
      summary: Create new user
      description: Creates a new user account in the system. Requires admin privileges. Password must meet complexity requirements.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Unique username
                password:
                  type: string
                  description: Password (must meet complexity requirements)
                full_name:
                  type: string
                  description: User's full name
                email:
                  type: string
                  format: email
                  description: User's email address
                is_admin:
                  type: boolean
                  default: false
                  description: Whether user has admin privileges
                is_active:
                  type: boolean
                  default: true
                  description: Whether account is active
              required:
                - username
                - password
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '400':
          description: Invalid input or password doesn't meet requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized - Requires admin privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user details
      description: Retrieves detailed information about a specific user. Requires admin privileges. Includes account status, login history, and security information.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          description: Unauthorized - Requires admin privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Update user
      description: Updates an existing user's account information. Requires admin privileges. Cannot modify admin user except by themselves.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: New password (must meet complexity requirements)
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                is_admin:
                  type: boolean
                is_active:
                  type: boolean
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '400':
          description: Invalid input or password doesn't meet requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized or attempting to modify admin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Delete user
      description: Removes a user account from the system. Requires admin privileges. Cannot delete the admin user.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '403':
          description: Unauthorized or attempting to delete admin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'