                scheme:
                  type: string
                  enum: [http, https]
                port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                uri_path:
                  type: string
                  description: Empty or starting with /; no scheme or host inside
                uri_query:
                  type: string
                http_method:
                  type: string
                  enum: [GET, POST, PUT, PATCH, HEAD, OPTIONS, DELETE]
                http_headers:
                  type: object
                  description: Header map, stored as a JSON object; null clears it
                body_encoding:
                  type: string
                  enum: [text, json, base64, form]
                body:
                  type: string
                  description: Request body; send_string and body cannot both be set
                send_string:
                  type: string
                  description: When set, IS the request body (F5 semantics)
                receive_string:
                  type: string
                receive_regex:
                  type: boolean
                disable_string:
                  type: string
                disable_regex:
                  type: boolean
                expected_status:
                  type: string
                  description: Comma-separated NNN or NNN-NNN tokens (100..599); null means any 2xx/3xx
                follow_redirects:
                  type: boolean
                verify_tls:
                  type: boolean
                timeout:
                  type: integer
                  minimum: 1
                  maximum: 120
                auth_type:
                  type: string
                  enum: [none, basic, bearer, header]
                auth_header_name:
                  type: string
                auth_credential_id:
                  type: string
                  format: uuid
                  description: Reference into the credentials table - never inline a secret; attaching a HIGH or CRITICAL sensitivity credential requires admin
                is_active:
                  type: boolean
      responses:
        '200':
          description: Service updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '400':
          description: Invalid input, no update data, or polling parameters supplied (pollcount/pollinterval are fixed after creation, or duplicate service)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required, or the referenced credential has HIGH or CRITICAL sensitivity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Services
      summary: Delete service
      description: |
        Removes a service check. This operation cannot be undone.
        Deleting the service's target or agent cascades here too, so
        this route only handles the explicit case. Admin-only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Service ID
      responses:
        '200':
          description: Service deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cgi-bin/api/service/{id}/reset:
    post:
      tags:
        - Services
      summary: Reset service counters
      description: |
        Clears the rolled-up state for a service - last_state back to
        UNKNOWN, the status code, reason, message and last_check
        cleared, last_change re-stamped, and total_down back to 0.
