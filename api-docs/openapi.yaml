                    type: string
                    example: success
                  message:
                    type: string
                  id:
                    type: string
                    format: uuid
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

